apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aicrme.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "aicrme.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Recreate, not the default RollingUpdate: replicas is 1, but RollingUpdate
  # with the default maxSurge rounds up to 1, so old and new pods overlap
  # during every upgrade. Both would recover from and write to the same run
  # ConfigMap, against a design that assumes a single writer. A few seconds of
  # downtime on upgrade costs a single-operator demo console nothing; leader
  # election would be machinery for a problem this product does not have.
  strategy:
    type: Recreate
  selector:
    matchLabels: {{- include "aicrme.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "aicrme.labels" . | nindent 8 }}
      annotations:
        # Forces a rollout when the auth Secret's content actually changes,
        # and only then. The password is the Secret's only mutable field —
        # the username is a fixed literal (aicrme.authUsername) — and it is
        # bound into this pod's env below, so a stale one means the console
        # authenticates against a credential NOTES.txt no longer prints.
        # Hashes the memoized aicrme.authPassword helper rather than
        # re-rendering secret.yaml wholesale: that would call its
        # randAlphaNum generation path a second, independent time on a fresh
        # install, producing a different random string than the one actually
        # written to the Secret and causing the very next upgrade to see a
        # changed checksum (and roll the pod) despite nothing really changing.
        checksum/secret: {{ include "aicrme.authPassword" . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      # Only needed when image.repository is a private registry. The Kind and
      # KWOK paths load the image into the nodes directly and never pull, so
      # this is empty there; a real cluster pulling a private ghcr.io package
      # is the case it exists for.
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      # Pin the console away from nodes its own install disrupts. On EKS and
      # AKS, nodewright-customizations RESTARTS the GPU nodes, and a console
      # sitting on one is killed part-way through the very install that
      # rebooted it. GKE's COS image does not restart, so this is portability
      # insurance rather than a fix for any one cloud.
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "aicrme.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      # Must agree with the Dockerfile's `USER 10001` / `adduser -u 10001`.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: aicrme
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            # Every writable path the console and deploy.sh need is a
            # subdirectory of the work-dir emptyDir below, so nothing needs
            # to write to the image's own filesystem.
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: AICRME_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "aicrme.fullname" . }}-auth
                  key: username
            - name: AICRME_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "aicrme.fullname" . }}-auth
                  key: password
            - name: AICRME_TLS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "aicrme.fullname" . }}
                  key: AICRME_TLS
            - name: AICRME_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "aicrme.fullname" . }}
                  key: AICRME_NAMESPACE
            # Names this Deployment object so main can resolve it directly
            # (one Get, apps/v1) as the run ConfigMap's ownerReference --
            # never the ReplicaSet, which is replaced on every rollout and
            # would take the run state with it via garbage collection.
            - name: AICRME_DEPLOYMENT_NAME
              value: {{ include "aicrme.fullname" . | quote }}
            - name: AICRME_WORK_DIR
              value: /var/lib/aicrme
            # deploy.sh runs `mktemp -d`; helm and kubectl keep caches. With
            # readOnlyRootFilesystem the emptyDir is the only writable path,
            # so each tool is pointed into it explicitly. cmd/aicrme creates
            # these subdirectories at startup (an emptyDir mounts empty).
            - name: TMPDIR
              value: /var/lib/aicrme/tmp
            - name: HOME
              value: /var/lib/aicrme/home
            - name: HELM_CACHE_HOME
              value: /var/lib/aicrme/helm/cache
            - name: HELM_CONFIG_HOME
              value: /var/lib/aicrme/helm/config
            - name: HELM_DATA_HOME
              value: /var/lib/aicrme/helm/data
            - name: KUBECACHEDIR
              value: /var/lib/aicrme/kube/cache
          # Startup, not liveness, is what has to cover the work cmd/aicrme
          # does before httpSrv.ListenAndServe: resolving the run store's
          # ownerReference (deploymentLookupTimeout, 10s) and then
          # eng.Recover, whose load path retries up to maxLoadAttempts times
          # at cmStoreCallTimeout each. A control plane that accepts the
          # connection and then errors after its full timeout -- a proxy 504,
          # a reset -- surfaces as ErrCodeInternal, which IS in
          # loadCurrentRetryable's set, so all three attempts run: ~40s in
          # which nothing answers /healthz. The liveness probe alone kills at
          # 25s, so that was a CrashLoopBackOff waiting for a slow control
          # plane. A startupProbe disables both liveness and readiness until
          # it succeeds, and this window allows 55s.
          # test/chart/contract.sh reads those three Go constants and pins
          # them against this window, so neither side can move alone.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 11
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: work
              mountPath: /var/lib/aicrme
      volumes:
        - name: work
          emptyDir:
            sizeLimit: {{ .Values.workDir.sizeLimit }}
