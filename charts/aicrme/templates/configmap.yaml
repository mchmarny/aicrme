# Non-secret runtime config. AICRME_USERNAME/AICRME_PASSWORD (secret.yaml)
# are the only credentials cmd/aicrme reads; everything sensitive stays out
# of this object.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aicrme.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "aicrme.labels" . | nindent 4 }}
data:
  # No TLS termination at the pod: reached via port-forward or an
  # Ingress/LoadBalancer that terminates TLS in front of it.
  AICRME_TLS: "false"
  # Where Discover runs AICR's privileged snapshot-agent Job. Must follow the
  # release namespace: cmd/aicrme defaults this to the literal "aicrme", so
  # leaving it unset on an install into any other namespace would have AICR's
  # deployer create a second, undisclosed "aicrme" namespace and run the
  # privileged Job there — outside the release, and left behind by
  # `helm uninstall`.
  AICRME_NAMESPACE: {{ .Release.Namespace | quote }}
