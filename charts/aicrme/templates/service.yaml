apiVersion: v1
kind: Service
metadata:
  name: {{ include "aicrme.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "aicrme.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector: {{- include "aicrme.selectorLabels" . | nindent 4 }}
