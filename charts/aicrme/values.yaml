image:
  repository: ghcr.io/mchmarny/aicrme/aicrme
  tag: ""          # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

# imagePullSecrets names pre-existing Secrets for a private image.repository.
# Empty for Kind and KWOK, which load the image into the nodes and never pull,
# and empty for a public ghcr.io package. Create the Secret yourself and name
# it here -- the chart never handles a credential:
#   kubectl -n aicrme create secret docker-registry ghcr \
#     --docker-server=ghcr.io --docker-username=<user> --docker-password=<PAT>
imagePullSecrets: []

# nodeSelector and tolerations place the console pod. Empty on Kind and KWOK,
# which have nowhere else to put it.
#
# On a real cluster, pin it to a SYSTEM pool, away from the GPU nodes. The
# recipe installs nodewright-customizations, which on EKS and AKS restarts the
# GPU nodes -- and a console running on one is killed part-way through the
# install that rebooted it. GKE's COS image does not restart, so this is
# portability insurance rather than a fix for one cloud. scripts/demo-remote.sh
# detects a GPU-free pool and sets this automatically.
#
#   nodeSelector:
#     cloud.google.com/gke-nodepool: my-system-pool
nodeSelector: {}
tolerations: []

service:
  type: ClusterIP  # LoadBalancer exposes a cluster-admin console; see NOTES.txt
  port: 8080

auth:
  # No username knob: the console is single-user by design and the login name
  # is fixed to "admin" (see aicrme.authUsername in templates/_helpers.tpl).
  password: ""     # generated when empty, preserved across upgrade

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits:   { memory: 512Mi }

# Scratch space for generated bundles plus the helm, kubectl, and bash temp
# directories deploy.sh needs. emptyDir, not a PVC: a bundle is regenerated
# deterministically from the pinned, embedded recipe catalog on every run,
# so nothing here needs to outlive the pod. sizeLimit is measured against a
# real bundle -- see docs/phase-2-handoff.md, "New for 2b" section
# (workDir.sizeLimit), which carries the measured 352K figure.
workDir:
  sizeLimit: 1Gi

# Shutdown budget. cmd/aicrme drains HTTP and stops any in-flight run
# concurrently, bounded by runShutdownTimeout (30s) -- which itself must
# exceed the applier's 10s process-group kill grace plus the engine's 5s
# terminal-state write. 45s leaves margin over that 30s budget; the
# Kubernetes default of 30s would leave none at all.
# test/chart/contract.sh reads both constants from source and pins them
# against this value, so the two cannot drift apart silently.
terminationGracePeriodSeconds: 45
