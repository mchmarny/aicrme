# Not user-facing: a real (not nil) map is required so _helpers.tpl's
# aicrme.authPassword can cache the resolved password into it once per
# render (see the comment there for why that cache exists).
global: {}

image:
  repository: ghcr.io/mchmarny/aicrme/aicrme
  tag: ""          # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

service:
  type: ClusterIP  # LoadBalancer exposes a cluster-admin console; see NOTES.txt
  port: 8080

auth:
  username: admin
  password: ""     # generated when empty, preserved across upgrade

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits:   { memory: 512Mi }
