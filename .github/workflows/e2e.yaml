name: e2e
# Mirrors ci.yaml's triggers deliberately. Phases 0-1, 2a, and 2b-i all
# merged straight to main with no pull request, so a pull_request-only
# trigger meant these three jobs had never executed in CI at all -- the
# amd64 coverage this workflow exists to provide was assumed, not observed
# (every real run to date has been a developer's arm64 Mac).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per ref at a time: a newer push cancels an in-flight run rather
# than queuing behind it. Each job below stands up its own Kind cluster and
# installs a whole recipe, so a stale, superseded run left alive just burns runner
# minutes for a result nobody will read.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - id: go
        run: echo "version=$(cat .go-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.go.outputs.version }}
      # The console embeds the SPA, so `make build` -- which every script now
      # runs -- needs npm. Pinned and cached exactly as ci.yaml pins it, so a
      # build that passes the gate and one that runs here cannot use two
      # different Node majors.
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      # install_only: smoke.sh creates and tears down its own Kind cluster;
      # this step only needs to put kind, kubectl, and helm on the runner.
      # helm matters beyond kind here: the console shells out to whatever helm
      # is on PATH, and refuses to start without one.
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - run: test/e2e/smoke.sh

  discover-recommend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - id: go
        run: echo "version=$(cat .go-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.go.outputs.version }}
      # The console embeds the SPA, so `make build` -- which every script now
      # runs -- needs npm. Pinned and cached exactly as ci.yaml pins it, so a
      # build that passes the gate and one that runs here cannot use two
      # different Node majors.
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      # install_only: discover-recommend.sh creates and tears down its own
      # Kind cluster (plus the KWOK controller and simulated GPU nodes
      # inside it); this step only needs to put kind, kubectl, and helm on
      # the runner, and the console shells out to the last two.
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - run: test/e2e/discover-recommend.sh

  apply-dryrun:
    runs-on: ubuntu-latest
    # apply-dryrun.sh's own polling budget (Discover 7.5m + Recommend/Bundle
    # 3m + Apply 40m = 50.5m) plus 10-15m of cluster and console setup can
    # total roughly an hour in the worst case the script's loops permit, even
    # though the dry-run ceiling means today's real run finishes in minutes.
    # 45m was silently narrower than that budget; 75m gives it room without
    # masking a genuinely wedged run behind an hours-long CI timeout. See the
    # comment above apply-dryrun.sh's Apply poll loop for the budget math.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - id: go
        run: echo "version=$(cat .go-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.go.outputs.version }}
      # The console embeds the SPA, so `make build` -- which every script now
      # runs -- needs npm. Pinned and cached exactly as ci.yaml pins it, so a
      # build that passes the gate and one that runs here cannot use two
      # different Node majors.
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      # install_only: apply-dryrun.sh creates and tears down its own Kind
      # cluster (plus the KWOK controller and simulated GPU nodes inside
      # it) and builds and runs the console itself; this step only needs to
      # put kind, kubectl, and helm on the runner, and the console shells out
      # to the last two.
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - run: test/e2e/apply-dryrun.sh

  apply-real:
    runs-on: ubuntu-latest
    # Same 75m budget as apply-dryrun: the script's own loops permit
    # Discover 7.5m + Recommend/Bundle 3m + Apply 40m + a 3m settle, and this
    # job adds the one cost --dry-run never pays -- pulling every component's
    # container images. Two local verification runs installed all 14 in 6m02s
    # each; the headroom is for a slow runner's pulls, not for the install.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      # A real install pulls every component's images into the Kind nodes,
      # which --dry-run never does. ubuntu-latest ships ~14GB free, most of it
      # spoken for by preinstalled toolchains this job does not use; reclaiming
      # them first is cheaper than diagnosing an ImagePullBackOff caused by a
      # full disk, which surfaces as a component failure rather than as a disk
      # error.
      - name: reclaim runner disk for image pulls
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
            /usr/local/lib/android "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          df -h / | tail -1
      - id: go
        run: echo "version=$(cat .go-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.go.outputs.version }}
      # The console embeds the SPA, so `make build` -- which every script now
      # runs -- needs npm. Pinned and cached exactly as ci.yaml pins it, so a
      # build that passes the gate and one that runs here cannot use two
      # different Node majors.
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      # install_only: apply-real.sh creates and tears down its own multi-node
      # Kind cluster (plus the KWOK controller and simulated GPU nodes inside
      # it) and builds and runs the console itself; this step only needs to
      # put kind, kubectl, and helm on the runner, and the console shells out
      # to the last two.
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - run: test/e2e/apply-real.sh
      # Kept deliberately, with apply-real.sh's instrumentation. `if: always()`
      # is the entire point: the 2026-08-19 11:23 failure killed the script in a
      # way that skipped its EXIT trap, so everything it had captured was dumped
      # nowhere and lost with the runner. A collector that runs regardless is
      # the only one that survives the script dying badly -- and apply-real
      # still fails intermittently for a reason nobody has captured yet.
      - name: collect e2e diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apply-real-diag
          path: .e2e-diag/
          if-no-files-found: warn
          retention-days: 7

  prove:
    runs-on: ubuntu-latest
    # A real install (~6m locally) plus the Prove assertions on top: one gang
    # placed, a console restart over it, a Stop that fails and one that
    # succeeds, and a second run whose gang deliberately never places (bounded
    # by AICRME_PROVE_GANG_TIMEOUT, which the script sets to 45s rather than
    # waiting out the three-minute production default). Measured end to end at
    # 13 minutes locally, of which ~4 was the install; the rest of this budget
    # is the same slow-runner headroom apply-real carries, since this job pulls
    # the same component images.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # Same reclaim as apply-real, for the same reason: this job performs a
      # real install and pulls every component's images.
      - name: reclaim runner disk for image pulls
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
            /usr/local/lib/android "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          df -h / | tail -1
      - id: go
        run: echo "version=$(cat .go-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.go.outputs.version }}
      # The console embeds the SPA, so `make build` -- which every script now
      # runs -- needs npm. Pinned and cached exactly as ci.yaml pins it, so a
      # build that passes the gate and one that runs here cannot use two
      # different Node majors.
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - run: test/e2e/prove.sh

  reset:
    runs-on: ubuntu-latest
    # Two real installs plus two teardowns. The first run's arc is the same
    # ~6m apply-real pays; the reset itself is thirteen `helm uninstall
    # --wait` calls, and the second run repeats the install so a FAILED
    # teardown (blocked by an admission webhook) can be provoked against a
    # cluster that genuinely has something to remove. Budgeted like
    # apply-real and prove, with the same slow-runner headroom: this job
    # pulls every component's images twice over.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      # Same reclaim as apply-real and prove, for the same reason, and more
      # so: two real installs on one runner.
      - name: reclaim runner disk for image pulls
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
            /usr/local/lib/android "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          df -h / | tail -1
      - id: go
        run: echo "version=$(cat .go-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.go.outputs.version }}
      # The console embeds the SPA, so `make build` -- which every script now
      # runs -- needs npm. Pinned and cached exactly as ci.yaml pins it, so a
      # build that passes the gate and one that runs here cannot use two
      # different Node majors.
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: helm/kind-action@v1
        with:
          install_only: true
      # THIS JOB, AND ONLY THIS JOB, RUNS HELM 4.
      #
      # The console shells out to whatever helm is on PATH, and every other
      # job here gets the runner's own -- v3.21.4, measured in run
      # 33172700011. Teardown is the half of the product whose helm-4 behaviour
      # was never observed in CI: a real cluster proved a full install and
      # uninstall under v4.2.4 by hand, but reset.sh's FAILED-teardown
      # assertion -- a blocked uninstall that must then block Start, Retry and
      # Discard -- had only ever run under helm 3, because that is what the
      # runner ships. Uninstall is where the two majors differ most (helm 4
      # changed --wait's default and its resource-deletion ordering), and it is
      # exactly the path this job exercises twice.
      #
      # Pinning it here rather than globally is deliberate and buys MORE
      # coverage, not less: the other five jobs keep exercising helm 3, so one
      # workflow now spans both majors instead of moving wholesale to the newer
      # one. Deliberately after kind-action, which puts the runner's helm on
      # PATH -- this step must be the one that wins.
      #
      # v4.2.4 exactly, because that is the version a real GKE H100 cluster
      # installed and uninstalled 16 releases under. Bump the two together.
      - uses: azure/setup-helm@v4
        with:
          version: v4.2.4
      - run: helm version --short
      - run: test/e2e/reset.sh
      # The residue inventory and the cluster's own before/after are the
      # whole evidence base for an ownership claim, and a script that dies
      # badly takes them with it -- same reasoning as apply-real's.
      - name: collect e2e diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reset-diag
          path: .e2e-diag/
          if-no-files-found: warn
          retention-days: 7
