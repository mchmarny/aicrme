name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    # Without this, GitHub's 6h default applies: an apt-get hang burned two
    # full 6h runs on 2026-08-19 before anyone noticed. The gate itself takes
    # ~10m, so anything past 30m is wedged, not slow.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - id: go
        run: echo "version=$(cat .go-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.go.outputs.version }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      # shellcheck comes from its own release, NOT apt: apt's version floats
      # with the runner image, and a floating linter means `make lint-shell` can
      # pass locally and fail here on an unchanged file -- which is exactly what
      # it did on 2026-08-19. Version is owned by .settings.yaml (linting.shellcheck).
      - name: install pinned shellcheck
        run: |
          set -euo pipefail
          # sed, not yq: yq is installed by a later step, and a linter pin that
          # depends on install order is a trap for whoever reorders this file.
          want="$(sed -n 's/^  shellcheck: *.\(v[0-9.]*\).*/\1/p' .settings.yaml)"
          [ -n "${want}" ] || { echo "no shellcheck pin in .settings.yaml"; exit 1; }
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${want}/shellcheck-${want}.linux.x86_64.tar.xz" \
            | tar -xJ --strip-components=1 -C /usr/local/bin "shellcheck-${want}/shellcheck"
          shellcheck --version | grep -E '^version:'
      - uses: mikefarah/yq@v4.53.3
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.1
      # Every gate below is a make target, so `make qualify` locally runs the
      # identical commands. They stay listed separately here only so a failure
      # names the gate that broke rather than the whole target.
      - run: make web
      - run: make lint-shell
      - run: make test-web
      - run: make test-coverage
      - run: make check-aicr-pin

  # A release is cut from a tag, which is the worst place to discover that
  # .goreleaser.yaml no longer parses or that the binary ships an empty
  # console. This job builds the real artifacts on every push and never
  # publishes anything, so both are found at the commit that caused them.
  release-dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          # goreleaser reads tags to compute a version; a shallow clone makes
          # it guess, and the snapshot template then names artifacts wrongly.
          fetch-depth: 0
      - id: go
        run: echo "version=$(cat .go-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.go.outputs.version }}
      # goreleaser's `before` hook runs `make web`, which needs npm.
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - id: goreleaser
        # sed rather than yq, matching the shellcheck step above: a pin that
        # depends on install order is a trap for whoever reorders this file.
        run: |
          set -euo pipefail
          want="$(sed -n 's/^  goreleaser: *.\(v[0-9.]*\).*/\1/p' .settings.yaml)"
          [ -n "${want}" ] || { echo "no goreleaser pin in .settings.yaml"; exit 1; }
          echo "version=${want}" >> "$GITHUB_OUTPUT"
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: ${{ steps.goreleaser.outputs.version }}
          args: release --snapshot --clean --skip=publish
      # The check that cannot be made from config alone: run the artifact and
      # prove the console is in it. See the script's own header.
      - run: ./scripts/smoke-release.sh dist
