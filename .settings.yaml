# Go toolchain version is owned by .go-version (single source of truth).
quality:
  coverage_threshold: 80

linting:
  golangci_lint: 'v2.12.2'
  # Pinned 2026-08-19 after an unpinned shellcheck cost a red main: CI installed
  # it from apt while a developer had a newer build, so `make lint-shell` passed
  # locally and failed in CI on the same file. Every other tool here is pinned
  # for exactly this reason; this one had simply never drifted before.
  shellcheck: 'v0.11.0'

build_tools:
  ko: 'v0.19.1'
  yq: 'v4.53.3'

test_tools:
  kind: 'v0.31.0'
  kwok: 'v0.8.0'

dependencies:
  # renovate: datasource=go depName=github.com/NVIDIA/aicr depType=dependencies
  aicr: 'v0.19.0'
